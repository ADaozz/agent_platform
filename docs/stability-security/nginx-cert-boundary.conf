# 证书登录代理边界示例（需按实际 upstream / 证书路径替换后纳入部署 Nginx）。
# 443 不启用 mTLS，并清除外部伪造的证书 Header。
# 8443 仅写入 Nginx 自己的 $ssl_client_*，不透传客户端同名 Header。

upstream personal_demo_backend {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    # ssl_certificate / ssl_certificate_key ...
    # 不要在此 server 配置 ssl_verify_client

    location /api/ {
        # 末尾斜杠去掉 /api 前缀：/api/login → 后端 /login
        proxy_pass http://personal_demo_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Verify "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-DN "";
    }
}

server {
    listen 8443 ssl;
    # ssl_client_certificate .../client-ca-bundle.crt;
    # 保留 optional_no_ca，待实机确认 SUCCESS / FAILED / NONE 与指纹匹配边界。
    ssl_verify_client optional_no_ca;

    location = /login/cert {
        # 精确路径不要加末尾斜杠，否则会把 /login/cert 换成 /
        proxy_pass http://personal_demo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }
}
