# 复制为 application-local.yml 并填入真实值（该文件已被 git 忽略）
# 也可改用环境变量：DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET / JWT_API_SECRET
spring:
  datasource:
    url: jdbc:kingbase8://127.0.0.1:54321/lwt_personal_demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: your-db-username
    password: your-db-password

jwt:
  # HS256 签名密钥，不少于 32 个字符；可用 openssl rand -base64 48 生成
  secret: change-me-to-a-random-string-at-least-32-chars
  api:
    secret: change-me-to-another-random-string-32-chars
