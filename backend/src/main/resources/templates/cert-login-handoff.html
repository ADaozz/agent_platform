<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>证书登录 · Deep Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --cream: #f5eddc;
      --muted: #9a9282;
      --line: #3a3630;
      --signal: #f36b18;
      --card: rgb(28 27 25 / 0.72);
      --font: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --display: 'Barlow Condensed', 'IBM Plex Sans', 'Noto Sans SC', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--cream);
      background: var(--bg);
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 70% 55% at 50% -10%, rgb(243 107 24 / 0.14), transparent 58%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgb(226 133 79 / 0.08), transparent 55%),
        linear-gradient(180deg, #1a1917 0%, #121211 100%);
    }
    .card {
      width: min(420px, 100%);
      padding: 2.25rem 2rem 1.85rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 1.35rem;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    /* 与 BrandGlyph.vue 一致：三色条 + A */
    .brand-glyph {
      position: relative;
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 auto 1.35rem;
      background: linear-gradient(90deg, #41cbb5 0 33.34%, #fcbe08 0 66.67%, #e73c2a 0);
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12);
    }
    .brand-glyph::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgb(255 255 255 / 0.05) 0 1px, transparent 1px 3px);
    }
    .brand-glyph-a {
      position: absolute;
      inset: 0;
      filter: drop-shadow(-1px -1px 0 #e73c2a) drop-shadow(1.5px 1.5px 0 rgb(8 32 30 / 0.6));
    }
    .brand-glyph-a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #f5ecd0;
      clip-path: polygon(15% 86%, 64.8% 14%, 85% 14%, 85% 86%, 66.6% 86%, 66.6% 42.6%, 37% 86%);
    }
    .progress {
      width: 96px;
      height: 2px;
      margin: 0 auto 1.35rem;
      overflow: hidden;
      border-radius: 1px;
      background: var(--line);
    }
    .progress > span {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--signal);
      animation: slide 1.1s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(28px, 6vw, 36px);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .sub {
      margin: 0.85rem 0 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
    }
    .hint {
      margin: 1.5rem 0 0;
      padding-top: 1.1rem;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      line-height: 1.6;
      color: #7f786c;
    }
    .hint strong {
      color: #cfc5b2;
      font-weight: 600;
    }
    noscript .sub { color: #d8a078; }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress > span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <p class="eyebrow">Deep Agent</p>
    <span class="brand-glyph" role="img" aria-label="Deep Agent">
      <span class="brand-glyph-a" aria-hidden="true"></span>
    </span>
    <div class="progress" aria-hidden="true"><span></span></div>
    <h1>正在验证证书</h1>
    <p class="sub">正在通过安全通道完成身份确认，随后自动进入工作区。</p>
    <p class="hint">若浏览器弹出证书选择框，请选择 <strong>签名证书（sign）</strong>，不要选择加密证书。</p>
  </main>
  <form id="f" method="POST" action="{{ACTION}}"></form>
  <script>
    document.getElementById('f').submit();
  </script>
  <noscript>
    <main class="card" style="margin-top:1rem">
      <h1>需要继续</h1>
      <p class="sub">请启用 JavaScript，或直接提交下方表单以完成证书登录。</p>
      <p class="hint"><button form="f" type="submit" style="all:unset;cursor:pointer;color:var(--signal);font-weight:600">继续证书登录 →</button></p>
    </main>
  </noscript>
</body>
</html>
