# 数据源配置
spring:
  # 未指定 profile 时默认 8080（Spring Boot 默认端口，等同 prod）
  # 本地 IDE 请在运行配置中激活 dev → application-dev.yml 使用 8081
  # 生产部署：java -jar app.jar --spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod
  # 数据库密码、JWT 密钥等敏感配置：环境变量，或 application-local.yml（不入库，模板见 application-local.example.yml）
  config:
    import: optional:classpath:application-local.yml
  main:
    allow-bean-definition-overriding: true
  # 不在本应用解析 multipart：Agent 文件上传由网关原样转发，若先被解析，转发出去的请求体为空。
  # 本应用没有直接接收文件的接口；新增时需改为按路径单独处理。
  servlet:
    multipart:
      enabled: false
  datasource:
    type: com.kingbase8.ds.KBPoolingDataSource
    driver-class-name: com.kingbase8.Driver
    url: ${DB_URL:jdbc:kingbase8://127.0.0.1:54321/lwt_personal_demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
  # 注册验证码邮件（163 邮箱 SMTP，密码为第三方客户端授权码，非登录密码）
  # 真实账号/授权码放环境变量或 application-local.yml（不入库）
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

# 自助注册
register:
  # 新注册账号默认角色（需具备我的证书 / 登录设备等个人权限）
  default-role: 普通用户
  code:
    # 验证码有效期：5 分钟
    expire-seconds: 300
    # 同一邮箱重发等待：60 秒
    resend-interval-seconds: 60
    # 同一验证码最多允许输错次数
    max-attempts: 5

# MyBatis-Plus：Kingbase 下避免 sys_user 等同名系统视图冲突
mybatis-plus:
  global-config:
    db-config:
      schema: public

# JWT 配置
jwt:
  # 签名密钥（HS256 建议不少于 32 位）
  secret: ${JWT_SECRET}
  # 过期时间（秒），默认 2 小时
  expire: 7200
  api:
    secret: ${JWT_API_SECRET}
    expire: 604800

# 客户端证书签发与存储
cert:
  storage-base-path: /home/neo/application/personalDemo/ca/client/users
  intermediate-cert: /home/neo/application/personalDemo/ca/intermediate/intermediate-ca.crt
  intermediate-key: /home/neo/application/personalDemo/ca/intermediate/intermediate-ca.key
  root-cert: /home/neo/application/personalDemo/ca/root/root-ca.crt
  default-valid-days: 365
  p12-password-length: 16
  login:
    # 默认关闭。Beta 启用时必须同时提供可信代理与 HTTPS public-origin，否则启动失败。
    enabled: ${CERT_LOGIN_ENABLED:false}
    trusted-proxies: ${CERT_LOGIN_TRUSTED_PROXIES:127.0.0.1,::1}
    public-origin: ${CERT_LOGIN_PUBLIC_ORIGIN:}
    allowed-origins: ${CERT_LOGIN_ALLOWED_ORIGINS:}
# Agent Runtime 由 Python 进程提供，仅通过本应用的 JWT/Shiro 网关访问。
# AGENT_RUNTIME_SHARED_SECRET 与 Python 的 ITAM_RUNTIME_SHARED_SECRET 必须相同，
# 至少 32 字节。禁止将该密钥提交到仓库。
agent:
  runtime:
    url: ${AGENT_RUNTIME_URL:http://127.0.0.1:8090}
    shared-secret: ${AGENT_RUNTIME_SHARED_SECRET:}
    connect-timeout-ms: ${AGENT_RUNTIME_CONNECT_TIMEOUT_MS:5000}
    # 普通 REST；SSE 与文件传输使用下面的独立超时，避免互相误杀
    read-timeout-ms: ${AGENT_RUNTIME_READ_TIMEOUT_MS:60000}
    sse-read-timeout-ms: ${AGENT_RUNTIME_SSE_READ_TIMEOUT_MS:0}
    file-read-timeout-ms: ${AGENT_RUNTIME_FILE_READ_TIMEOUT_MS:300000}
